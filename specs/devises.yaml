# Référentiel des devises KINSHASA MOSOLO (module 89).
# Devise principale : CDF. Chaque devise est affichée avec le drapeau du pays émetteur.
# Pour une devise commune à plusieurs pays, "drapeau" désigne le drapeau retenu par configuration
# (union monétaire ou pays de référence) ; il est modifiable sans redéploiement.
devise_principale: CDF
source_taux_officiel: "Banque Centrale du Congo — cours indicatif du jour [règle d'application À VÉRIFIER]"
devises:
  - {code: CDF, nom: "Franc congolais",        drapeau: "🇨🇩", pays: CD, decimales: 2, role: principale, liquidation: oui, paiement: oui}
  - {code: USD, nom: "Dollar américain",       drapeau: "🇺🇸", pays: US, decimales: 2, role: legale_secondaire, liquidation: "si la règle l'exige", paiement: oui}
