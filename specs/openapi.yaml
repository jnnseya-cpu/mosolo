openapi: 3.1.0
info:
  title: KINSHASA MOSOLO — API du socle (v1)
  version: 1.0.0
  summary: Plateforme souveraine des recettes de la Ville-Province de Kinshasa
  description: |
    Contrat de référence : `specs/contrat-api.md`. Montants au format `MoneyJSON` (`{"amount": "150.00", "currency": "USD"}`),
    jamais de nombre flottant. Erreurs au format RFC 9457 (`application/problem+json`) avec un `code` stable.

    **Authentification de démonstration** : en-tête `x-demo-user: <userId>` (voir `GET /v1/demo/users`).
    En production : OIDC + clés d'accès (passkeys), mTLS + signatures pour les prestataires.

    Routes marquées `x-extension: true` : compléments du socle, non listés dans le contrat v1 (le frontend peut les ignorer).
  license:
    name: Propriété de la Ville-Province de Kinshasa
servers:
  - url: http://localhost:8080
    description: Développement local (`npm run dev -w backend`)
tags:
  - { name: Système }
  - { name: Identité }
  - { name: Objets }
  - { name: Registre juridique }
  - { name: Liquidation }
  - { name: Paiements }
  - { name: Trésor }
  - { name: Quittances }
  - { name: Coffre }
  - { name: Audit }
  - { name: Communications }
  - { name: Brouillons }
  - { name: IA }
  - { name: Tableaux de bord }
  - { name: Change }
  - { name: Terrain }
  - { name: Réclamations }
  - { name: Sécurité }

security:
  - demoUser: []

paths:
  /health:
    get:
      tags: [Système]
      summary: Santé du service
      security: []
      responses:
        '200':
          description: Service disponible
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  time: { type: string, format: date-time }

  /v1/meta:
    get:
      tags: [Système]
      summary: Devises (avec drapeaux), langues, compteurs du catalogue, communes, entités
      security: []
      responses:
        '200':
          description: Métadonnées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }

  /v1/demo/users:
    get:
      tags: [Système]
      summary: Utilisateurs de démonstration
      security: []
      responses:
        '200':
          description: Utilisateurs semés
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DemoUser' }

  /v1/registrations:
    post:
      tags: [Identité]
      summary: Inscription d'un contribuable (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201':
          description: Compte créé (niveau N0, téléphone à vérifier)
          content:
            application/json:
              schema:
                type: object
                required: [taxpayerId, iuc, verificationLevel]
                properties:
                  taxpayerId: { type: string, examples: [TP-000001] }
                  iuc: { type: string, examples: [KIN-7F3K9Q2M-X] }
                  verificationLevel: { $ref: '#/components/schemas/VerificationLevel' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/taxpayers/{id}:
    get:
      tags: [Identité]
      summary: Profil, objets, obligations, quittances
      description: |
        Contribuable (soi), mandataire, agents habilités. `access: minimal` (agent de terrain dans son territoire) :
        aucun montant (`amount: null`), ni bail ni quittance. Gouverneur et super-administrateur : 403.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerProfile' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/fiscal-objects:
    post:
      tags: [Objets]
      summary: Déclaration d'un objet fiscal provisoire
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalObjectRequest' }
      responses:
        '201':
          description: Objet provisoire créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalObject' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/leases:
    post:
      tags: [Objets]
      summary: Déclaration de bail (bailleur, locataire ou mandataire)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaseRequest' }
      responses:
        '201':
          description: Bail déclaré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/legal-rules:
    get:
      tags: [Registre juridique]
      summary: Liste des fiches de règles (tous agents)
      responses:
        '200':
          description: Fiches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RuleSheet' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Registre juridique]
      summary: Création d'une fiche (R13) — statut BROUILLON
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Fiche créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/legal-rules/{id}:
    get:
      tags: [Registre juridique]
      summary: Détail d'une fiche avec les entrées requises par la formule
      x-extension: true
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/RuleSheet' }
                  - type: object
                    properties:
                      requiredInputs: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/legal-rules/{id}/approve:
    post:
      tags: [Registre juridique]
      summary: Visa (REDACTEUR R13 → VERIFICATEUR_JURIDIQUE R14 → VALIDATEUR_FINANCIER R15 → AUTORITE_PUBLICATION R16)
      description: |
        Quatre personnes distinctes (sinon 403 `SEPARATION_OF_DUTIES`). La 4e approbation publie (`PUBLIEE`),
        puis `ACTIVE` dès la date d'effet. Publication bloquée (422) si un instrument est abrogé
        (`ABROGATED_INSTRUMENT`), non en vigueur (`INSTRUMENT_NOT_IN_FORCE`) ou si la source n'est pas certifiée (`SOURCE_NOT_CERTIFIED`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/ApprovalRole' }
      responses:
        '200':
          description: Fiche après visa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSheet' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/legal-instruments:
    get:
      tags: [Registre juridique]
      summary: Registre des instruments juridiques (liste noire des abrogés incluse)
      x-extension: true
      responses:
        '200':
          description: Instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LegalInstrument' }

  /v1/assessments/calculate:
    post:
      tags: [Liquidation]
      summary: Calcul déterministe (simulation ou liquidation) — R06, R07, R11
      description: |
        `simulate: true` est permis pour une règle non exécutable (ex. A_VERIFIER) : la trace porte `nonOpposable: true`.
        `simulate: false` exige une règle exécutable, sinon 422 `RULE_NOT_EXECUTABLE` (tentative journalisée) ;
        en cas de succès, une obligation est créée (201).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculateRequest' }
      responses:
        '200':
          description: Simulation (aucune obligation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculateResponse' }
        '201':
          description: Liquidation (obligation créée)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculateResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/obligations:
    get:
      tags: [Liquidation]
      summary: Obligations (selon droits ; contribuable = les siennes)
      parameters:
        - { name: taxpayerId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Obligations visibles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ObligationSummary' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/obligations/{id}:
    get:
      tags: [Liquidation]
      summary: Obligation + explication (règle, version, base légale, formule, entrées, montant, échéance, voie de recours)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Obligation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObligationDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/obligations/{id}/payment-orders:
    post:
      tags: [Paiements]
      summary: Création d'une référence de paiement (contribuable, mandataire, guichet)
      description: |
        `Idempotency-Key` obligatoire : même clé + même contenu → même réponse (en-tête `idempotent-replayed: true`) ;
        même clé + contenu différent → 409 `IDEMPOTENCY_KEY_REUSED`. Le montant (= solde) et l'alias bénéficiaire (coffre)
        ne sont jamais fournis par le client (tout champ supplémentaire → 400).

        Champ facultatif `provider` (`bitripay` | `koda`, canaux `MOBILE_MONEY` et `QR` uniquement) : une intention est créée
        chez le prestataire (Idempotency-Key sortante = référence de paiement ; métadonnées = référence, ordre, obligation ;
        aucune donnée personnelle), et la réponse porte en plus `provider`, `providerIntentId`, `checkoutUrl`, `qrPayload`, `sandbox`.
        Sans clé API configurée : bac à sable local (`sandbox: true`, `providerIntentId` `sbx_…`, `checkoutUrl: null`, aucun appel réseau).
        Échec sortant → 502 `PROVIDER_UNAVAILABLE` et **aucun ordre enregistré** ; montant non représentable dans les unités
        mineures du prestataire (ex. CDF à zéro décimale chez KODA) → 422 `AMOUNT_NOT_REPRESENTABLE` ; compte de règlement du
        prestataire ≠ bénéficiaire de l'obligation → 422 `SETTLEMENT_ACCOUNT_MISMATCH`. Le lien de paiement ne vaut jamais preuve :
        seule la confirmation serveur à serveur signée fait passer l'ordre à `CONFIRME`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentOrderRequest' }
      responses:
        '201':
          description: Référence émise (ou rejouée)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrder' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /v1/providers/{provider}/callbacks:
    post:
      tags: [Paiements]
      summary: Confirmation signée d'un prestataire → CONFIRME + quittance provisoire
      description: |
        Vérifications : `x-signature` = HMAC-SHA256 hexadécimal du corps brut avec le secret du prestataire ;
        `x-timestamp` dans ±5 min ; `x-nonce` unique (sinon 409 `NONCE_REPLAYED` + alerte) ; `providerTxnId` unique
        (rejeu → 200 avec `replayed: true`, sans double effet) ; montant et référence identiques à l'ordre
        (sinon 422 `AMOUNT_MISMATCH` / `UNKNOWN_PAYMENT_REFERENCE` + alerte). Aucune quittance par un autre moyen.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, examples: [mm-operator-a] } }
        - { name: x-signature, in: header, required: true, schema: { type: string, pattern: '^(sha256=)?[0-9a-f]{64}$' } }
        - { name: x-nonce, in: header, required: true, schema: { type: string } }
        - { name: x-timestamp, in: header, required: true, schema: { type: string, format: date-time } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCallback' }
      responses:
        '200':
          description: Traité (y compris rejeu idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallbackResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/providers/koda/webhooks:
    post:
      tags: [Paiements]
      summary: Webhook signé KODA → confirmation (CONFIRME + quittance provisoire)
      description: |
        Serveur à serveur uniquement. `x-koda-signature` = HMAC-SHA256 hexadécimal du **corps brut** avec le secret de webhook
        (`KODA_WEBHOOK_SECRET` ; démo : `demo-whsec-koda`), comparé à temps constant. Invalide ou absente → 401 + alerte de sécurité.
        Événements `payment.verified` et `payment.verified.late` → confirmation commune (`confirmFromProvider`, méthode
        `KODA_OPERATOR_LEDGER`) : référence, liaison ordre ↔ intention, montant exact, doublon, écritures, quittance provisoire.
        Montant en unités mineures KODA (**CDF à zéro décimale** : `25000` = 25 000 FC ; USD à deux décimales : `589` = 5,89 $).
        Identifiant d'événement déjà traité → 200 `replayed: true`, sans double effet. Autre type → 200 ignoré + audit.
        Forme exacte du corps [À VÉRIFIER sur /v1/openapi.json de KODA] : parseur tolérant (voir `KodaWebhookEvent`).
      security: []
      parameters:
        - { name: x-koda-signature, in: header, required: true, schema: { type: string, pattern: '^(sha256=)?[0-9a-f]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KodaWebhookEvent' }
      responses:
        '200':
          description: Traité, rejoué ou ignoré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/providers/bitripay/webhooks:
    post:
      tags: [Paiements]
      summary: Webhook signé BitriPay → confirmation, ou annonce de règlement (indice seulement)
      description: |
        Serveur à serveur uniquement. `BitriPay-Signature: t=<unix>,v1=<hex>` avec `v1` = HMAC-SHA256 de `"<t>.<corps brut>"`
        (secret `whsec_…` ; démo : `demo-whsec-bitripay`), tolérance ±5 min ; en complément, `BitriPay-Signature-Ed25519`
        (signature base64 du corps brut) vérifiée si la clé publique de la plateforme est configurée (exigible par configuration).
        Format exact [À VÉRIFIER sur l'OpenAPI BitriPay]. Invalide → 401 + alerte.
        `payment_intent.succeeded` → `CONFIRME` + quittance provisoire (méthode `BITRIPAY_RAIL`) ;
        `payment_intent.canceled` → `ECHOUE` ; `payment_intent.payment_failed` → journalisé sans changement d'état (tentative non terminale) ;
        `payment_intent.settled` → **annonce de règlement** : conservée comme indice de rapprochement, audit
        `payment.settlement_announced`, **aucun passage à `REGLE` / `RAPPROCHE`** (réservé au relevé du compte public).
      security: []
      parameters:
        - { name: BitriPay-Signature, in: header, required: true, schema: { type: string, examples: ['t=1790413200,v1=5f0c…'] } }
        - { name: BitriPay-Signature-Ed25519, in: header, required: false, schema: { type: string, contentEncoding: base64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BitriPayWebhookEvent' }
      responses:
        '200':
          description: Traité, rejoué, annonce enregistrée ou ignoré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/payment-orders/{reference}/provider-verification-evidence:
    post:
      tags: [Paiements]
      summary: Pièce de dossier — vérification capture / SMS chez le prestataire (R17, R18, R20)
      x-extension: true
      description: |
        Relaie la demande à l'API de vérification du prestataire (KODA `POST /intents/{id}/verify`, BitriPay `POST /verifications`)
        pour documenter un litige ou une exception. **Le résultat est une pièce de dossier (`legalEffect: AUCUN`)** : il ne change
        jamais l'état du paiement et n'émet jamais de quittance (aucune quittance sur capture d'écran ou code SMS, § 18.5).
        Interdit au contribuable (403). Aucune image n'est reçue : seulement son empreinte SHA-256 ; le code SMS est conservé haché.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationEvidenceRequest' }
      responses:
        '201':
          description: Pièce enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationEvidence' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /v1/payment-orders/{reference}/provider-resolution:
    post:
      tags: [Paiements]
      summary: Pièce de dossier — « ce paiement a-t-il eu lieu ? » chez le prestataire (R17, R18, R20)
      x-extension: true
      description: |
        Interroge BitriPay `GET /payment_resolution` (avec l'en-tête `BitriPay-Account` si un compte connecté est configuré).
        **Pièce de dossier (`legalEffect: AUCUN`)** : même « CONFIRMED », la réponse ne change jamais l'état du paiement et
        n'émet jamais de quittance. Interdit au contribuable (403).
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Réponse du prestataire versée au dossier
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, legalEffect, provider, paymentReference, providerResult, sandbox]
                properties:
                  id: { type: string }
                  kind: { type: string, enum: [PROVIDER_PAYMENT_RESOLUTION] }
                  legalEffect: { type: string, enum: [AUCUN] }
                  notice: { type: string }
                  provider: { type: string }
                  paymentReference: { type: string }
                  orderStatusAtRequest: { type: string }
                  providerResult: {}
                  sandbox: { type: boolean }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /v1/settlements/statements:
    post:
      tags: [Trésor]
      summary: Import d'un relevé (R17) → rapprochement à trois voies
      description: Idempotent par `statementId` (rejeu identique → 200 ; contenu différent → 409 `STATEMENT_ALREADY_IMPORTED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementRequest' }
      responses:
        '201':
          description: Relevé importé et rapproché
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementResult' }
        '200':
          description: Relevé déjà importé (rejeu)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/reconciliation/exceptions:
    get:
      tags: [Trésor]
      summary: Exceptions de rapprochement (R17, R18, R22)
      responses:
        '200':
          description: Exceptions ouvertes (dont « règlement manquant » calculé à J+1)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReconciliationException' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/ledger/entries:
    get:
      tags: [Trésor]
      summary: Écritures du grand livre (R17, R22, R23)
      parameters:
        - { name: sourceId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Écritures (ajout seul, chaînées)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LedgerEntry' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/ledger/entries/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    delete:
      tags: [Trésor]
      summary: Interdit — grand livre en ajout seul
      x-extension: true
      responses:
        '405': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Trésor]
      summary: Interdit — grand livre en ajout seul
      x-extension: true
      responses:
        '405': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Trésor]
      summary: Interdit — grand livre en ajout seul
      x-extension: true
      responses:
        '405': { $ref: '#/components/responses/Problem' }

  /v1/ledger/entries/{id}/reversals:
    post:
      tags: [Trésor]
      summary: Contre-écriture liée à l'original (R17) — seule forme de correction
      x-extension: true
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        '201':
          description: Contre-écriture passée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/ledger/balance:
    get:
      tags: [Trésor]
