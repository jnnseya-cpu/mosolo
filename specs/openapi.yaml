        Logo `/logo-ville-de-kinshasa.png`, bandeau tricolore, bloc entité (DGIPK, DGTK, MINFIN…), mention d'avis obligatoire,
        « La version française fait foi. » si `lang ≠ fr`, pied « Plateforme KINSHASA MOSOLO — réalisée par Groupe Nseya ».
        L'objet (encodé URI) est aussi renvoyé dans l'en-tête `x-mosolo-subject`.
      parameters:
        - { name: eventCode, in: path, required: true, schema: { type: string, examples: [assessment.issued] } }
        - { $ref: '#/components/parameters/Lang' }
