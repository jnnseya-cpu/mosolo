      tags: [Audit]
      summary: Interdit — journal en ajout seul
      x-extension: true
      responses:
        '405': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Audit]
      summary: Interdit — journal en ajout seul
      x-extension: true
      responses:
        '405': { $ref: '#/components/responses/Problem' }

  /v1/audit/verify:
    get:
