        '404': { $ref: '#/components/responses/Problem' }

  /v1/drafts/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,120}$' } }
    put:
      tags: [Brouillons]
      summary: Enregistrement automatique — crée une nouvelle version à chaque appel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Version enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [key, version, savedAt, changeSummary, changes]
                properties:
                  key: { type: string }
                  version: { type: integer }
                  savedAt: { type: string, format: date-time }
                  changeSummary: { type: string, examples: ['3 champs modifiés : surface (120 → 135), usage (habitation → commerce), photo ajouté'] }
                  changes: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        '400': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Brouillons]
      summary: Dernière version (propriétaire uniquement)
      responses:
        '200':
          description: Brouillon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftVersion' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/drafts/{key}/versions:
    get:
      tags: [Brouillons]
      summary: Historique complet des versions (propriétaire uniquement)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DraftVersion' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/ai/insights:
