  /v1/communications/events:
    get:
      tags: [Communications]
      summary: Catalogue des événements (agents)
      parameters:
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: mandatory, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                required: [total, categories, events]
                properties:
                  total: { type: integer }
                  categories: { type: array, items: { $ref: '#/components/schemas/EventCategory' } }
                  events: { type: array, items: { $ref: '#/components/schemas/CommunicationEvent' } }

  /v1/communications/preview/{eventCode}:
    get:
      tags: [Communications]
