      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              additionalProperties: false
              properties:
                context: { type: string, enum: [governor, rental, treasury, communications] }
                subjectId: { type: string }
      responses:
        '201':
          description: Recommandation émise (sans effet tant qu'elle n'est pas décidée)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIRecommendation' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/ai/recommendations:
    get:
      tags: [IA]
      summary: Liste des recommandations (agents)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [EMISE, ACCEPTEE, MODIFIEE, REJETEE] } }
        - { name: context, in: query, required: false, schema: { type: string, enum: [governor, rental, treasury, communications] } }
      responses:
        '200':
          description: Recommandations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AIRecommendation' }

  /v1/ai/recommendations/{id}/decide:
    post:
      tags: [IA]
      summary: Décision humaine (journalisée) — aucune exécution automatique
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [ACCEPTEE, REJETEE, MODIFIEE] }
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: Recommandation décidée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIRecommendation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/dashboards/governor:
    get:
      tags: [Tableaux de bord]
      summary: 'Centre de commandement du Gouverneur (R01, R02, R05) — données « example: true »'
      responses:
        '200':
          description: Tableau de bord (agrégats seulement)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernorDashboard' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/exchange-rates/{date}:
    get:
      tags: [Change]
      summary: Taux officiels de démonstration (source déclarée « BCC (démo) »)
      security: []
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Taux (CDF pour une unité de devise)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '400': { $ref: '#/components/responses/Problem' }
        '404':
          description: '`FX_RATE_MISSING` — aucun taux publié pour cette date'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/field-sync/batches:
    post:
      tags: [Terrain]
      summary: Lot de constats signé par la clé de l'appareil enrôlé (R10)
      description: |
        `x-device-signature` = HMAC-SHA256 hexadécimal du corps brut avec la clé de l'appareil. Appareil révoqué → 403
        `DEVICE_REVOKED` (+ alerte). Idempotent par `batchId`. Deux agents divergents sur un même champ → les deux constats
        sont conservés et un conflit `A_ARBITRER` est ouvert. Aucun constat ne crée de dette.
      parameters:
        - { name: x-device-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldBatch' }
      responses:
        '200':
          description: Résultat de synchronisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldBatchResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/appeals:
    post:
      tags: [Réclamations]
      summary: Dépôt d'une réclamation (contribuable, mandataire) — l'obligation passe CONTESTEE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationId, grounds]
              additionalProperties: false
              properties:
                obligationId: { type: string }
                grounds: { type: string, minLength: 5 }
                requestedAmount: { $ref: '#/components/schemas/MoneyJSON' }
      responses:
        '201':
          description: Réclamation déposée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/appeals/{id}:
    get:
      tags: [Réclamations]
      summary: Dossier de réclamation
      x-extension: true
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Réclamation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/appeals/{id}/instruct:
    post:
      tags: [Réclamations]
      summary: Instruction et proposition (R20) — étape préalable à la décision
      x-extension: true
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal, analysis]
              additionalProperties: false
              properties:
                proposal: { $ref: '#/components/schemas/AppealDecision' }
                analysis: { type: string, minLength: 5 }
                proposedAmount: { $ref: '#/components/schemas/MoneyJSON' }
      responses:
        '200':
          description: Réclamation instruite (PROPOSITION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/appeals/{id}/decide:
    post:
      tags: [Réclamations]
      summary: Décision (R21, distinct de l'instructeur) — crée une obligation rectificative, ne supprime rien
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              additionalProperties: false
              properties:
                decision: { $ref: '#/components/schemas/AppealDecision' }
                reason: { type: string, minLength: 5 }
                rectifiedAmount:
                  allOf: [ { $ref: '#/components/schemas/MoneyJSON' } ]
                  description: Obligatoire si PARTIELLEMENT_ACCEPTEE ; 0 par défaut si ACCEPTEE
      responses:
        '200':
          description: Réclamation décidée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appeal' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/security/alerts:
    get:
      tags: [Sécurité]
      summary: Alertes de sécurité et de fraude (R22, R24, R28)
      x-extension: true
      responses:
        '200':
          description: Alertes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SecurityAlert' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    demoUser:
      type: apiKey
      in: header
      name: x-demo-user
      description: Identifiant d'un utilisateur de démonstration (voir GET /v1/demo/users). DÉMO UNIQUEMENT.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    Lang:
      name: lang
      in: query
      required: false
      description: Sinon `Accept-Language` ; français par défaut (langue de référence).
      schema: { $ref: '#/components/schemas/LanguageCode' }

  responses:
    Problem:
      description: Erreur RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Code stable
          examples: [RULE_NOT_EXECUTABLE, FORBIDDEN, SEPARATION_OF_DUTIES, IDEMPOTENCY_KEY_REUSED, NONCE_REPLAYED, FX_RATE_MISSING, PROVIDER_UNAVAILABLE, AMOUNT_NOT_REPRESENTABLE, PROVIDER_ORDER_MISMATCH]
        instance: { type: string }
      additionalProperties: true

    CurrencyCode:
      type: string
      enum: [CDF, USD, EUR, GBP, CAD, CHF, ZAR, XAF, AOA, ZMW, RWF, UGX, KES, TZS, BIF, CNY, AED]
    LanguageCode:
      type: string
      enum: [fr, ln, sw, kg, lua, en]
    EntityCode:
      type: string
      enum: [GOUVERNORAT, MINFIN, DGIPK, DGTK, TRESOR, AUDIT, PLATEFORME, CONTENTIEUX, PUBLIC]
    RoleCode:
      type: string
      pattern: '^R(0[1-9]|[12][0-9]|3[0-7])$'
    VerificationLevel:
      type: string
      enum: [N0, N0A, N1, N2, N3]
    MoneyJSON:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: '^\d+(\.\d+)?$', examples: ['150.00'] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    FxConversion:
      type: object
      required: [amount, rate, rateDate, source, indicative]
      properties:
        amount: { $ref: '#/components/schemas/MoneyJSON' }
        rate: { type: string, examples: ['2850'] }
        rateDate: { type: string, format: date }
        source: { type: string, examples: ['BCC (démo)'] }
        indicative: { type: boolean, const: true }
        demo: { type: boolean }

    Meta:
      type: object
      properties:
        name: { type: string }
        apiVersion: { type: string }
        primaryCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        currencies:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/CurrencyCode' }
              name: { type: string }
              flag: { type: string }
              country: { type: string }
              decimals: { type: integer }
              role: { type: string, enum: [principale, legale_secondaire, paiement_diaspora, affichage] }
              assessable: { type: boolean }
              payable: { type: boolean }
        referenceLanguage: { $ref: '#/components/schemas/LanguageCode' }
        languages:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/LanguageCode' }
              name: { type: string }
              nativeName: { type: string }
              role: { type: string }
              status: { type: string }
              completeness: { type: integer }
        catalogue:
          type: object
          properties:
            events: { type: integer, examples: [255] }
            categories: { type: integer, examples: [23] }
            mandatory: { type: integer, examples: [126] }
        communes: { type: array, items: { type: string }, minItems: 24, maxItems: 24 }
        entities: { type: array, items: { type: object, properties: { code: { type: string }, name: { type: string }, shortName: { type: string } } } }
        roles: { type: object, additionalProperties: { type: string } }
        demo: { type: object, additionalProperties: { type: string } }
        receiptVerificationKey:
          type: object
          properties:
            algorithm: { type: string, const: Ed25519 }
            publicKeyPem: { type: string }

    DemoUser:
      type: object
      required: [id, name, roles, entity]
      properties:
        id: { type: string }
        name: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleCode' } }
        roleLabels: { type: array, items: { type: string } }
        entity: { type: string }
        taxpayerId: { type: string }
        territory: { type: array, items: { type: string } }

    RegistrationRequest:
      type: object
      required: [phone, fullName, language, situation]
      additionalProperties: false
      properties:
        phone: { type: string, examples: ['+243810000001'] }
        fullName: { type: string }
        language: { $ref: '#/components/schemas/LanguageCode' }
        situation: { type: string, enum: [owner_occupier, landlord, tenant, subtenant, authorised_occupier, property_manager, business_tenant, other] }
        email: { type: string, format: email }

    FiscalObjectRequest:
      type: object
      required: [category, commune, quartier, localityRank, lat, lon]
      additionalProperties: false
      properties:
        taxpayerId: { type: string }
        category: { type: string, enum: [PARCELLE, BATIMENT, UNITE_LOCATIVE, ACTIVITE, VEHICULE, PANNEAU, AUTRE] }
        commune: { type: string, description: Une des 24 communes de Kinshasa }
        quartier: { type: string }
        localityRank: { type: integer, enum: [1, 2, 3, 4] }
        lat: { type: number, minimum: -5.2, maximum: -3.9 }
        lon: { type: number, minimum: 15.0, maximum: 16.6 }
        attributes: { type: object, additionalProperties: true }
    FiscalObject:
      allOf:
        - $ref: '#/components/schemas/FiscalObjectRequest'
        - type: object
          required: [id, status, probativeStatus, createdBy, createdAt]
          properties:
            id: { type: string }
            observed: { type: object, additionalProperties: true }
            status: { type: string, enum: [PROVISOIRE, VALIDE] }
            probativeStatus: { type: string, enum: [DECLARE, OBSERVE, VERIFIE, CONTESTE] }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }

    LeaseRequest:
      type: object
      required: [unitObjectId, rent, periodicity, start]
      additionalProperties: false
      properties:
        unitObjectId: { type: string }
        lessorId: { type: string }
        lesseeId: { type: string }
        rent: { $ref: '#/components/schemas/MoneyJSON' }
        periodicity: { type: string, enum: [MENSUELLE, TRIMESTRIELLE, SEMESTRIELLE, ANNUELLE] }
        start: { type: string, format: date }
        end: { type: string, format: date }
    Lease:
      allOf:
        - $ref: '#/components/schemas/LeaseRequest'
        - type: object
          properties:
            id: { type: string }
            declaredBy: { type: string }
            declaredByRole: { type: string, enum: [BAILLEUR, LOCATAIRE, MANDATAIRE] }
            probativeStatus: { type: string }
            createdAt: { type: string, format: date-time }

    TaxpayerProfile:
      type: object
      required: [access, taxpayer, objects, obligations]
      properties:
        access: { type: string, enum: [full, minimal] }
        taxpayer:
          type: object
          properties:
            id: { type: string }
            iuc: { type: string }
            fullName: { type: string }
            phone: { type: string, description: Masqué sauf pour le titulaire }
            language: { $ref: '#/components/schemas/LanguageCode' }
            situation: { type: string }
            verificationLevel: { $ref: '#/components/schemas/VerificationLevel' }
            createdAt: { type: string, format: date-time }
        objects: { type: array, items: { $ref: '#/components/schemas/FiscalObject' } }
        leases: { type: [array, 'null'], items: { $ref: '#/components/schemas/Lease' } }
        obligations: { type: array, items: { $ref: '#/components/schemas/ObligationSummary' } }
        paymentOrders:
          type: array
          items:
            type: object
            properties:
              paymentOrderId: { type: string }
              paymentReference: { type: string }
              obligationId: { type: string }
              status: { $ref: '#/components/schemas/PaymentStatus' }
              amount: { $ref: '#/components/schemas/MoneyJSON' }
              expiresAt: { type: string, format: date-time }
        receipts: { type: [array, 'null'], items: { $ref: '#/components/schemas/Receipt' } }
        inbox: { type: array, items: { type: object, additionalProperties: true }, description: Messages in-app (titulaire uniquement) }
        masked: { type: boolean }

    ApprovalRole:
      type: string
      enum: [REDACTEUR, VERIFICATEUR_JURIDIQUE, VALIDATEUR_FINANCIER, AUTORITE_PUBLICATION]
    RuleStatus:
      type: string
      enum: [A_VERIFIER, BROUILLON, REVUE_JURIDIQUE, REVUE_FINANCIERE, APPROUVEE, PUBLIEE, ACTIVE, SUSPENDUE, EXPIREE, ABROGEE, ARCHIVEE]
    RuleInput:
      type: object
      additionalProperties: false
      required: [code, revenueCategory, label, legalInstrumentIds, articles, competentAuthority, administeringEntity, taxableEvent, liableParty, baseDefinition, formula, rateTable, currency, rounding, periodicity, dueRule, effectiveFrom, beneficiaryAccountAlias, appealPath, sourceVerification]
      properties:
        code: { type: string, pattern: '^[A-Z0-9-]{2,40}$' }
        revenueCategory: { type: string, enum: [IMPOT_PROVINCIAL, INTERET_COMMUN, PROVINCIAL_SPECIFIQUE, RECETTE_ETD, RECETTE_CENTRALE, PARTAGEE, DROIT_ADMINISTRATIF, REDEVANCE_SERVICE, PENALITE, CONCESSION_DOMANIALE, RECETTE_COMMERCIALE, ACTE_REQUIS] }
        label: { type: string }
        legalInstrumentIds: { type: array, items: { type: string }, minItems: 1 }
        articles: { type: array, items: { type: string }, minItems: 1 }
        competentAuthority: { type: string }
        administeringEntity: { type: string }
        taxableEvent: { type: string }
        liableParty: { type: string }
        withholdingAgent: { type: string }
        baseDefinition: { type: string }
        formula:
          type: string
          description: 'Langage de règles : nombres décimaux, identifiants, + - * /, parenthèses, max(), min(). Identifiant résolu dans les entrées, puis `rateTable[nom]`, puis `rateTable["nom:<rang>"]`.'
          examples: ['max(0, loyers_percus * taux / 100 - retenues_imputees)', 'forfait']
        rateTable: { type: object, additionalProperties: { type: string }, examples: [{ 'forfait:1': '450', 'forfait:2': '150' }] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        rounding: { type: string, enum: [HALF_UP, HALF_EVEN, DOWN, UP] }
        periodicity: { type: string, enum: [ANNUELLE, MENSUELLE, PONCTUELLE] }
        dueRule: { type: string }
        exemptions: { type: array, items: { type: object, properties: { basis: { type: string }, proof: { type: string } } } }
        penalties: { type: array, items: { type: object, properties: { basis: { type: string }, description: { type: string } } } }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
        beneficiaryAccountAlias: { type: string, description: Alias du coffre (jamais un numéro de compte) }
        appealPath: { type: string }
        sourceVerification: { type: string, enum: [OFFICIEL_CERTIFIE, PRESSE, DOCUMENT_DE_TRAVAIL, AUCUNE] }
        changeReason: { type: string }
    RuleSheet:
      allOf:
        - $ref: '#/components/schemas/RuleInput'
        - type: object
          required: [id, version, status, approvals]
          properties:
            id: { type: string }
            version: { type: integer }
            status: { $ref: '#/components/schemas/RuleStatus' }
            approvals:
              type: array
              items:
                type: object
                properties:
                  role: { $ref: '#/components/schemas/ApprovalRole' }
                  userId: { type: string }
                  at: { type: string, format: date-time }
            supersedesVersionId: { type: string }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            publishedAt: { type: string, format: date-time }
            activatedAt: { type: string, format: date-time }
            sample: { type: boolean, description: Fiche modèle de l'Annexe B (A_VERIFIER) }
            demo: { type: boolean, description: Règle fictive de démonstration }
    LegalInstrument:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [A_VERIFIER, EN_VIGUEUR, MODIFIE, ABROGE] }
        abrogatedOn: { type: string, format: date }
        abrogatedBy: { type: string }
        demo: { type: boolean }

    CalculateRequest:
      type: object
      required: [ruleId, taxpayerId, objectId, simulate]
      additionalProperties: false
      properties:
        ruleId: { type: string }
        taxpayerId: { type: string }
        objectId: { type: string }
        inputs: { type: object, additionalProperties: { type: string, pattern: '^-?\d+(\.\d+)?$' }, description: Valeurs décimales en chaînes }
        simulate: { type: boolean }
    AssessmentTrace:
      type: object
      required: [ruleId, ruleVersion, legalInstrumentIds, formula, inputs, rates, result, computedAt, nonOpposable]
      properties:
        ruleId: { type: string }
        ruleCode: { type: string }
        ruleVersion: { type: integer }
        ruleStatus: { $ref: '#/components/schemas/RuleStatus' }
        legalInstrumentIds: { type: array, items: { type: string } }
        formula: { type: string }
        inputs: { type: object, additionalProperties: { type: string } }
        rates: { type: object, additionalProperties: { type: string } }
        localityRank: { type: integer }
        rounding: { type: string }
        rawResult: { type: string }
        result: { $ref: '#/components/schemas/MoneyJSON' }
        computedAt: { type: string, format: date-time }
        simulate: { type: boolean }
        nonOpposable: { type: boolean }
        executable: { type: boolean }
        executabilityReason: { type: string }
    CalculateResponse:
      type: object
      required: [trace, obligation]
      properties:
        trace: { $ref: '#/components/schemas/AssessmentTrace' }
        obligation:
          oneOf:
            - { $ref: '#/components/schemas/ObligationDetail' }
            - { type: 'null' }
    TerritorialAttribution:
      type: object
      description: |
        § 20.3 — commune du fait générateur (lieu de l'objet ou du service), jamais l'adresse du contribuable ni le lieu
        du paiement. Figée à la liquidation ; `commune: null` ⇔ `basis: NON_LOCALISE` (recette « non attribuée », jamais devinée).
      required: [commune, basis, attributedAt]
      properties:
        commune: { type: [string, 'null'] }
        quartier: { type: string }
        basis: { type: string, enum: [LIEU_OBJET, ZONE_SERVICE, STATION_DEPART, NON_LOCALISE] }
        sourceId: { type: string }
        attributedAt: { type: string, format: date-time }
    ObligationStatus:
      type: string
      enum: [EMISE, EXIGIBLE, PARTIELLEMENT_PAYEE, SOLDEE, EN_RETARD, CONTESTEE, ANNULEE, ADMISE_EN_NON_VALEUR]
    ObligationSummary:
      type: object
      required: [id, taxpayerId, objectId, label, status, dueDate, amount]
      properties:
        id: { type: string }
        taxpayerId: { type: string }
        objectId: { type: string }
        label: { type: string }
        revenueCategory: { type: string }
        entity: { type: string }
        status: { $ref: '#/components/schemas/ObligationStatus' }
        dueDate: { type: string, format: date }
        ruleCode: { type: string }
        ruleVersion: { type: integer }
        amount:
          oneOf:
            - { $ref: '#/components/schemas/MoneyJSON' }
            - { type: 'null' }
          description: null si accès minimal
        masked: { type: boolean }
        supersedes: { type: string }
        supersededBy: { type: string }
        createdAt: { type: string, format: date-time }
        attribution: { $ref: '#/components/schemas/TerritorialAttribution' }
    ObligationExplanation:
      type: object
      required: [rule, legalBasis, baseDefinition, base, formula, rates, amount, dueDate, appealPath]
      properties:
        rule:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            label: { type: string }
            version: { type: integer }
        legalBasis:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              status: { type: string }
        articles: { type: array, items: { type: string } }
        competentAuthority: { type: string }
        administeringEntity: { type: string }
        taxableEvent: { type: string }
        liableParty: { type: string }
        baseDefinition: { type: string }
        base: { type: object, additionalProperties: { type: string } }
        formula: { type: string }
        rates: { type: object, additionalProperties: { type: string } }
        localityRank: { type: integer }
        rounding: { type: string }
        amount: { $ref: '#/components/schemas/MoneyJSON' }
        dueDate: { type: string, format: date }
        dueRule: { type: string }
        appealPath: { type: string }
        computedAt: { type: string, format: date-time }
        rectification:
          type: object
          properties:
            supersedes: { type: string }
            appealId: { type: string }
            reason: { type: string }
    ObligationDetail:
      allOf:
        - $ref: '#/components/schemas/ObligationSummary'
        - type: object
          required: [explanation, trace]
          properties:
            beneficiaryAccountAlias: { type: string }
            explanation: { $ref: '#/components/schemas/ObligationExplanation' }
            trace: { $ref: '#/components/schemas/AssessmentTrace' }
            appealId: { type: string }
            paymentOrders:
              type: array
              items:
                type: object
                properties:
                  paymentOrderId: { type: string }
                  paymentReference: { type: string }
                  status: { $ref: '#/components/schemas/PaymentStatus' }
                  expiresAt: { type: string, format: date-time }
            receipts:
              type: array
              items:
                type: object
                properties:
                  number: { type: string }
                  code: { type: string }
                  status: { $ref: '#/components/schemas/ReceiptStatus' }

    PaymentStatus:
      type: string
      enum: [INITIE, CONFIRME, REGLE, RAPPROCHE, ECHOUE, DOUBLON, CONTREPASSE, REMBOURSE, CONTESTE]
    PaymentOrderRequest:
      type: object
      required: [channel]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [MOBILE_MONEY, BANK, CARD, AGENT_POINT, USSD, QR, TRANSFER] }
        displayCurrency: { $ref: '#/components/schemas/CurrencyCode' }
        provider:
          type: string
          enum: [bitripay, koda]
          description: Prestataire connecté (candidat, sous réserve d'agrément et de convention) ; canaux MOBILE_MONEY et QR uniquement
    PaymentOrder:
      type: object
      required: [paymentReference, amount, indicativeAmount, beneficiaryAlias, expiresAt, status, ussdInstructions]
      properties:
        paymentOrderId: { type: string }
        paymentReference: { type: string, pattern: '^PR-[0-9A-Z]{4}-[0-9A-Z]{4}$', examples: [PR-7F3K-9Q2M] }
        obligationId: { type: string }
        amount: { $ref: '#/components/schemas/MoneyJSON' }
        indicativeAmount:
          oneOf:
            - { $ref: '#/components/schemas/FxConversion' }
            - { type: 'null' }
          description: Contre-valeur indicative (CDF par défaut pour une obligation en devise ; ou `displayCurrency`)
        beneficiaryAlias: { type: string, examples: [KIN-DGIPK-RECETTES-01] }
        expiresAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        channel: { type: string }
        ussdInstructions: { type: string }
        provider: { type: string, enum: [bitripay, koda], description: Présent seulement si l'ordre est lié à un prestataire connecté }
        providerIntentId: { type: string, examples: [sbx_koda_1a2b3c4d5e6f7a8b, pi_123] }
        checkoutUrl: { type: [string, 'null'], description: Page de paiement du prestataire (null en bac à sable local). Ne vaut pas preuve de paiement. }
        qrPayload: { type: [string, 'null'], description: Charge utile QR (BitriPay) }
        sandbox: { type: boolean, description: Vrai en bac à sable local ou avec une clé de test du prestataire }
    ProviderCallback:
      type: object
      required: [providerTxnId, paymentReference, amount, status, completedAt]
      properties:
        providerTxnId: { type: string }
        paymentReference: { type: string }
        amount: { $ref: '#/components/schemas/MoneyJSON' }
        status: { type: string, enum: [SUCCESS, FAILED] }
        completedAt: { type: string, format: date-time }
        payerAmount:
          allOf: [ { $ref: '#/components/schemas/MoneyJSON' } ]
          description: Montant réellement payé par le payeur dans sa devise (ex. EUR, carte diaspora), converti par le prestataire
        payerMsisdnHash: { type: string }
    CallbackResponse:
      type: object
      required: [status, paymentReference]
      properties:
        status: { type: string, enum: [CONFIRME, ECHOUE, DOUBLON] }
        paymentReference: { type: string }
        receiptNumber: { type: string, examples: [Q-2026-KIN-000000001-7] }
        receiptCode: { type: string, examples: [Q26KIN0000000017] }
        receiptStatus: { $ref: '#/components/schemas/ReceiptStatus' }
        replayed: { type: boolean }

    KodaWebhookEvent:
      type: object
      description: |
        Forme tolérée [À VÉRIFIER sur /v1/openapi.json] : identifiant d'événement `id` | `event_id` ; intention `intent_id` |
        `intent.id` | `data.intent_id` ; montant entier (unités mineures KODA) `amount` | `data.amount` ; `currency` ; `receipt_id` ;
        `metadata.payment_reference` | `metadata.order_id` (aussi sous `data.` ou `intent.`).
      properties:
        id: { type: string }
        type: { type: string, enum: [payment.verified, payment.verified.late] }
        data:
          type: object
          properties:
            intent_id: { type: string }
            amount: { type: integer, examples: [25000] }
            currency: { type: string, examples: [CDF] }
            receipt_id: { type: string }
            metadata:
              type: object
              properties:
                payment_reference: { type: string }
                order_id: { type: string }
      additionalProperties: true
    BitriPayWebhookEvent:
      type: object
      description: Forme supposée « à la Stripe » [À VÉRIFIER sur l'OpenAPI BitriPay].
      properties:
        id: { type: string }
        type: { type: string, enum: [payment_intent.succeeded, payment_intent.settled, payment_intent.canceled, payment_intent.payment_failed] }
        created: { type: integer }
        data:
          type: object
          properties:
            object:
              type: object
              properties:
                id: { type: string }
                amount_minor: { type: integer }
                currency: { type: string }
                settlement_id: { type: string }
                metadata:
                  type: object
                  properties:
                    payment_reference: { type: string }
                    order_id: { type: string }
      additionalProperties: true
    ConnectorWebhookResponse:
      type: object
      required: [received, results]
      properties:
        received: { type: boolean, const: true }
        results:
          type: array
          items:
            type: object
            required: [eventId, eventType, outcome]
            properties:
              eventId: { type: string }
              eventType: { type: string }
              outcome: { type: string, enum: [PROCESSED, SETTLEMENT_ANNOUNCED, HELD, IGNORED] }
              status: { type: string, enum: [CONFIRME, ECHOUE, DOUBLON] }
              paymentReference: { type: string }
              receiptNumber: { type: string }
              receiptCode: { type: string }
              receiptStatus: { $ref: '#/components/schemas/ReceiptStatus' }
              reason: { type: string, enum: [UNKNOWN_TYPE, NON_TERMINAL_ATTEMPT_FAILURE] }
              replayed: { type: boolean }
    VerificationEvidenceRequest:
      type: object
      required: [caseRef]
      additionalProperties: false
      properties:
        caseRef: { type: string, description: Dossier de litige ou d'exception, ex. LIT-2026-0001 }
        smsCode: { type: string }
        screenshotSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    VerificationEvidence:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, const: PROVIDER_VERIFICATION_EVIDENCE }
        legalEffect: { type: string, const: AUCUN }
        notice: { type: string }
        caseRef: { type: string }
        provider: { type: string }
        paymentReference: { type: string }
        orderStatusAtRequest: { $ref: '#/components/schemas/PaymentStatus' }
        smsCodeSha256: { type: string }
        screenshotSha256: { type: string }
        providerResult: {}
        sandbox: { type: boolean }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }

    StatementRequest:
      type: object
      required: [statementId, lines]
      additionalProperties: false
      properties:
        statementId: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountAlias, amount, valueDate, paymentReference]
            additionalProperties: false
            properties:
              accountAlias: { type: string }
              amount: { $ref: '#/components/schemas/MoneyJSON' }
              valueDate: { type: string, format: date }
              paymentReference: { type: string }
    StatementResult:
      type: object
      properties:
        statementId: { type: string }
        importedAt: { type: string, format: date-time }
        importedBy: { type: string }
        lines: { type: integer }
        matched:
          type: array
          items:
            type: object
            properties:
              paymentReference: { type: string }
              receiptNumber: { type: string }
              obligationId: { type: string }
              amount: { $ref: '#/components/schemas/MoneyJSON' }
        exceptions: { type: array, items: { $ref: '#/components/schemas/ReconciliationException' } }
    ReconciliationException:
      type: object
      required: [id, type, detail, status, openedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [ORPHAN_CREDIT, CREDIT_WITHOUT_CONFIRMATION, DUPLICATE_CREDIT, WRONG_ACCOUNT, UNKNOWN_ACCOUNT, AMOUNT_MISMATCH, MISSING_SETTLEMENT, PROVIDER_AMBIGUOUS] }
        statementId: { type: string }
        paymentReference: { type: string }
        line: { type: object, additionalProperties: true }
        detail: { type: string }
        status: { type: string, const: OUVERTE }
        openedAt: { type: string, format: date-time }
        computed: { type: boolean }
    LedgerEntry:
      type: object
      required: [id, seq, at, eventType, lines, prevHash, hash]
      properties:
        id: { type: string }
        seq: { type: integer }
        at: { type: string, format: date-time }
        eventType: { type: string, examples: [ASSESSMENT, PAYMENT_CONFIRMED, SETTLEMENT_CREDITED, REVERSAL] }
        description: { type: string }
        sourceType: { type: string }
        sourceId: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              account: { type: string, enum: [CREANCES_CONTRIBUABLES, RECETTES_CONSTATEES, FONDS_A_RECEVOIR_PRESTATAIRES, COMPTE_PUBLIC_RECETTES] }
              side: { type: string, enum: [DEBIT, CREDIT] }
              amount: { $ref: '#/components/schemas/MoneyJSON' }
        reversalOf: { type: string }
        reason: { type: string }
        prevHash: { type: string }
        hash: { type: string }
    LedgerBalance:
      type: object
      required: [balanced, entries, byCurrency, accounts]
      properties:
        balanced: { type: boolean }
        entries: { type: integer }
        byCurrency:
          type: array
          items:
            type: object
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              debit: { $ref: '#/components/schemas/MoneyJSON' }
              credit: { $ref: '#/components/schemas/MoneyJSON' }
              balanced: { type: boolean }
        accounts:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              label: { type: string }
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              balance: { $ref: '#/components/schemas/MoneyJSON' }
        headHash: { type: [string, 'null'] }

    ReceiptStatus:
      type: string
      enum: [PROVISOIRE, DEFINITIVE, ANNULEE, REMPLACEE, SUSPECTE]
    Receipt:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        code: { type: string }
        status: { $ref: '#/components/schemas/ReceiptStatus' }
        paymentReference: { type: string }
        obligationId: { type: string }
        revenueCategory: { type: string }
        administration: { type: string }
        beneficiaryAlias: { type: string }
        amount: { $ref: '#/components/schemas/MoneyJSON' }
        payerAmount: { $ref: '#/components/schemas/MoneyJSON' }
        indicativeAmount: { $ref: '#/components/schemas/FxConversion' }
        channel: { type: string }
        provider: { type: string }
        providerTxnId: { type: string }
        paidAt: { type: string, format: date-time }
        issuedAt: { type: string, format: date-time }
        finalizedAt: { type: string, format: date-time }
        mention: { type: string }
        signature: { type: string, description: Ed25519, base64url }
        signatureAlgorithm: { type: string, const: Ed25519 }
        qrPayload: { type: string, examples: ['MOSOLO1|Q26KIN0000000017|<signature>'] }
        verificationPath: { type: string }
    PublicReceiptCheck:
      type: object
      required: [status, message, verifiedAt]
      additionalProperties: false
      properties:
        status: { type: string, enum: [VALID, PENDING, CANCELLED, REPLACED, FRAUD_SUSPECTED, UNKNOWN] }
        message: { type: string }
        settlementStatus: { type: string, enum: [PENDING_SETTLEMENT, RECONCILED], description: Présent si VALID ou PENDING }
        revenueCategory: { type: string }
        amount: { $ref: '#/components/schemas/MoneyJSON' }
        paidOn: { type: string, format: date }
        beneficiaryAdministration: { type: string }
        taxpayerRefSuffix: { type: string, examples: ['…7K2Q'] }
        verifiedAt: { type: string, format: date-time }

    BeneficiaryAccount:
      type: object
      properties:
        alias: { type: string }
        entity: { type: string }
        bankName: { type: string }
        accountNumber: { type: string, description: Masqué (•••• 1234) }
        holderName: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        version: { type: integer }
        effectiveSince: { type: string, format: date-time }
    ChangeRequestInput:
      type: object
      required: [alias, bankName, accountNumber, holderName, reason]
      additionalProperties: false
      properties:
        alias: { type: string }
        bankName: { type: string }
        accountNumber: { type: string, pattern: '^[A-Z0-9 ]{8,40}$' }
        holderName: { type: string }
        reason: { type: string }
    ChangeRequest:
      type: object
      required: [id, alias, status, approvals]
      properties:
        id: { type: string }
        alias: { type: string }
        proposed:
          type: object
          properties:
            bankName: { type: string }
            accountNumber: { type: string, description: Masqué }
            holderName: { type: string }
        reason: { type: string }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        approvals:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              at: { type: string, format: date-time }
              outOfBandVerified: { type: boolean, const: true }
        status: { type: string, enum: [EN_ATTENTE_APPROBATION, EN_REFROIDISSEMENT, EFFECTIF] }
        coolingEndsAt: { type: string, format: date-time }
        effectiveAt: { type: string, format: date-time }

    AuditRecord:
      type: object
      required: [id, seq, at, actor, action, resourceType, outcome, prevHash, hash, signature]
      properties:
        id: { type: string }
        seq: { type: integer }
        at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            kind: { type: string, enum: [user, system, provider, device, ai, public] }
            id: { type: string }
            roles: { type: array, items: { type: string } }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [string, 'null'] }
        outcome: { type: string, enum: [SUCCESS, DENIED, FAILURE] }
        details: { type: object, additionalProperties: true }
        prevHash: { type: string }
        hash: { type: string }
        signature: { type: string }
    AuditVerification:
      type: object
      required: [ok, length]
      properties:
        ok: { type: boolean }
        length: { type: integer }
        brokenAt: { type: integer, description: Numéro de séquence du premier enregistrement invalide }
        reason: { type: string }
        headHash: { type: string }
        verifiedAt: { type: string, format: date-time }

    EventCategory:
      type: object
      properties:
        code: { type: string }
        libelle: { type: string }
    Channel:
      type: string
      enum: [email, in-app, sms, push, whatsapp, ussd, svi, courrier]
    CommunicationEvent:
      type: object
      properties:
        code: { type: string }
        categorie: { type: string }
        libelle: { type: string }
        objet: { type: string }
        gravite: { type: string, enum: [info, success, warning, critical] }
        canaux_defaut: { type: array, items: { $ref: '#/components/schemas/Channel' } }
        whatsapp_optin: { type: boolean }
        obligatoire: { type: boolean }
        public: { type: array, items: { type: string, enum: [C, G, X] } }
    Delivery:
      type: object
      required: [id, at, eventCode, channel, recipientId, status, provider]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        eventCode: { type: string }
        category: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        recipientId: { type: string }
        recipientKind: { type: string, enum: [taxpayer, user] }
        recipientMasked: { type: string }
        status: { type: string, enum: [en_file, envoye, delivre, lu, echoue, journalise, supprime_par_preference] }
        provider: { type: string }
        providerMode: { type: string, enum: [internal, live, sandbox, aucun] }
        mandatory: { type: boolean }
        entity: { type: string }
        lang: { $ref: '#/components/schemas/LanguageCode' }
        attempts: { type: integer }
        contentHash: { type: string }
    CommunicationsOverview:
      type: object
      required: [catalogue, categories, mandatory, delivered, attempted, channelsWired, coverage, recent]
      properties:
        catalogue: { type: integer, examples: [255] }
        categories: { type: integer, examples: [23] }
        mandatory: { type: integer, examples: [126] }
        delivered: { type: integer }
        attempted: { type: integer }
        sandboxLogged: { type: integer }
        suppressedByPreference: { type: integer }
        channelsWired: { type: integer, description: Canaux raccordés (in-app + canaux avec clé fournisseur) }
        channelsTotal: { type: integer, examples: [8] }
        coverage: { type: object, additionalProperties: { type: integer }, description: Événements diffusés par défaut par canal }
        channels:
          type: array
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/Channel' }
              provider: { type: string }
              mode: { type: string, enum: [internal, live, sandbox] }
              wired: { type: boolean }
              defaultEvents: { type: integer }
              sent: { type: integer }
        recent: { type: array, items: { $ref: '#/components/schemas/Delivery' } }

    FieldChange:
      type: object
      properties:
        field: { type: string }
        kind: { type: string, enum: [ajoute, modifie, supprime] }
        before: {}
        after: {}
    DraftVersion:
      type: object
      required: [key, version, savedAt, data, changeSummary]
      properties:
        key: { type: string }
        version: { type: integer }
        savedAt: { type: string, format: date-time }
        savedBy: { type: string }
        data: { type: object, additionalProperties: true }
        changes: { type: array, items: { $ref: '#/components/schemas/FieldChange' } }
        changeSummary: { type: string }
        contentHash: { type: string }

    AIRecommendation:
      type: object
      description: Format de sortie standard (§ 23.5.7) — `@mosolo/shared` AIRecommendation
      required: [id, agent, modelVersion, autonomy, createdAt, status, situation, insight, risk, recommendation, nextAction, owner, deadline, confidence, sources]
      properties:
        id: { type: string }
        agent: { type: string, examples: ['Aide à la décision exécutive', 'Rapprochement', 'Intelligence locative', 'Communication'] }
        modelVersion: { type: string, examples: [regles-deterministes-1.0] }
        autonomy: { type: string, enum: [A_AUTO, B_VALIDATION, C_RECOMMANDATION] }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [EMISE, ACCEPTEE, MODIFIEE, REJETEE] }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        decisionReason: { type: string }
        situation: { type: string }
        insight: { type: string }
        risk: { type: string }
        recommendation: { type: string }
        nextAction: { type: string }
        owner: { type: string, description: Rôle responsable — jamais « l'IA » }
        deadline: { type: string, format: date }
        confidence: { type: string, enum: [HIGH, MEDIUM, LOW] }
        sources: { type: array, items: { type: string } }
        decision:
          type: object
          properties:
            bestOption: { type: string }
            alternativeOption: { type: string }
            riskOfInaction: { type: string }
            financialImpact: { type: string }
            operationalImpact: { type: string }
        context: { type: string, enum: [governor, rental, treasury, communications] }
        subjectId: { type: string }
        example: { type: boolean }
        aiAssistedNotice: { type: string }

    GovernorDashboard:
      type: object
      required: [example, tiles, ladder, byCommune, byCategory, trend, scenarios, criticalAlerts, actions]
      properties:
        liveByCommune:
          type: object
          description: Recettes RÉELLES par commune du fait générateur (§ 20.3) ; « payé » inclut « rapproché », jamais additionnés.
          properties:
            example: { type: boolean, const: false }
            rule: { type: string }
            note: { type: string }
            rows:
              type: array
              items:
                type: object
                required: [commune, confirmedCount, paid, reconciled]
                properties:
                  commune: { type: string, description: 'Nom de commune, ou NON_ATTRIBUE' }
                  confirmedCount: { type: integer }
                  paid: { type: array, items: { $ref: '#/components/schemas/MoneyJSON' } }
                  reconciled: { type: array, items: { $ref: '#/components/schemas/MoneyJSON' } }
        example: { type: boolean, const: true }
        exampleNotice: { type: string }
        currency: { type: string, const: CDF }
        generatedAt: { type: string, format: date-time }
        tiles:
          type: object
          properties:
            confirmedToday: { $ref: '#/components/schemas/MoneyJSON' }
            settledToday: { $ref: '#/components/schemas/MoneyJSON' }
            reconciledToday: { $ref: '#/components/schemas/MoneyJSON' }
            reconRateJ1: { type: string, examples: ['96.4'] }
            comparisonDMinus1: { type: string }
            criticalAlerts: { type: integer }
        ladder:
          type: array
          minItems: 11
          maxItems: 11
          items:
            type: object
            properties:
              rank: { type: integer }
              level: { type: string, enum: [potential, verified_base, assessed, due, overdue, disputed, initiated, confirmed, settled, reconciled, available] }
              amount: { $ref: '#/components/schemas/MoneyJSON' }
        byCommune:
          type: array
          minItems: 24
          maxItems: 24
          items:
            type: object
            properties:
              commune: { type: string }
              collected: { $ref: '#/components/schemas/MoneyJSON' }
              target: { $ref: '#/components/schemas/MoneyJSON' }
              complianceRate: { type: string }
              censusCoverage: { type: string }
              rentalCoverage: { type: string }
              color: { type: string, enum: [green, amber, red] }
        byCategory:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string }
              collected: { $ref: '#/components/schemas/MoneyJSON' }
              target: { $ref: '#/components/schemas/MoneyJSON' }
        trend:
          type: array
          items:
            type: object
            properties:
              month: { type: string, examples: ['2026-09'] }
              collected: { $ref: '#/components/schemas/MoneyJSON' }
              target: { $ref: '#/components/schemas/MoneyJSON' }
        scenarios:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [conservateur, attendu, ambitieux] }
              label: { type: string }
              yearEnd: { $ref: '#/components/schemas/MoneyJSON' }
              assumptions: { type: array, items: { type: string } }
        criticalAlerts:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              severity: { type: string }
              title: { type: string }
              detail: { type: string }
              example: { type: boolean }
        actions: { type: array, items: { $ref: '#/components/schemas/AIRecommendation' } }
        live:
          type: object
          description: Compteurs réels du socle (agrégats)
          additionalProperties: true

    ExchangeRates:
      type: object
      required: [date, base, source, demo, rates]
      properties:
        date: { type: string, format: date }
        base: { type: string, const: CDF }
        source: { type: string, examples: ['BCC (démo)'] }
        demo: { type: boolean }
        note: { type: string }
        rates:
          type: array
          items:
            type: object
            properties:
              currency: { $ref: '#/components/schemas/CurrencyCode' }
              flag: { type: string }
              name: { type: string }
              cdfPerUnit: { type: string }

    FieldBatch:
      type: object
      required: [batchId, deviceId, createdAt, operations]
      properties:
        batchId: { type: string }
        deviceId: { type: string }
        createdAt: { type: string, format: date-time }
        operations:
          type: array
          maxItems: 500
          items:
            type: object
            required: [opId, objectId, field, value, observedAt]
            properties:
              opId: { type: string }
              objectId: { type: string }
              field: { type: string, pattern: '^[A-Za-z0-9_.]{1,64}$' }
              value: { type: [string, number, boolean, 'null'] }
              observedAt: { type: string, format: date-time }
    FieldBatchResult:
      type: object
      required: [batchId, accepted, rejected, conflicts, revokedDevices]
      properties:
        batchId: { type: string }
        accepted: { type: array, items: { type: string } }
        rejected:
          type: array
          items:
            type: object
            properties:
              opId: { type: string }
              reason: { type: string, enum: [OBJECT_NOT_FOUND, OUT_OF_TERRITORY] }
        conflicts:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              objectId: { type: string }
              field: { type: string }
              status: { type: string, const: A_ARBITRER }
              versions:
                type: array
                items:
                  type: object
                  properties:
                    observationId: { type: string }
                    agentId: { type: string }
                    value: {}
                    observedAt: { type: string, format: date-time }
        revokedDevices: { type: array, items: { type: string } }
        replayed: { type: boolean }

    AppealDecision:
      type: string
      enum: [ACCEPTEE, PARTIELLEMENT_ACCEPTEE, REJETEE]
    Appeal:
      type: object
      required: [id, obligationId, taxpayerId, grounds, status]
      properties:
        id: { type: string }
        obligationId: { type: string }
        taxpayerId: { type: string }
        grounds: { type: string }
        requestedAmount: { $ref: '#/components/schemas/MoneyJSON' }
        status: { type: string, enum: [DEPOSEE, PROPOSITION, ACCEPTEE, PARTIELLEMENT_ACCEPTEE, REJETEE] }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        instructorId: { type: string }
        proposal: { type: object, additionalProperties: true }
        decision:
          type: object
          properties:
            decision: { $ref: '#/components/schemas/AppealDecision' }
            reason: { type: string }
            decidedBy: { type: string }
            at: { type: string, format: date-time }
            rectifiedAmount: { $ref: '#/components/schemas/MoneyJSON' }
        rectifyingObligationId: { type: string }

    SecurityAlert:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        type: { type: string, examples: [INVALID_SIGNATURE, NONCE_REPLAYED, AMOUNT_MISMATCH, REVOKED_DEVICE_SYNC, RECEIPT_SIGNATURE_INVALID] }
        severity: { type: string, enum: [MEDIUM, HIGH, CRITICAL] }
        source: { type: string }
        detail: { type: string }
        context: { type: object, additionalProperties: true }
