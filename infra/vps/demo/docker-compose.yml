# =====================================================================================================================
# KINSHASA MOSOLO — DÉMONSTRATION sur un VPS (02/10/2026 ; Hostinger ou tout Ubuntu) : application en mode
# démonstration (données fictives non contractuelles, en mémoire) + Caddy (HTTPS automatique). Aucune base de données.
# Projet Docker distinct (« mosolo-demo ») : ne touche jamais aux volumes du déploiement de production (../).
# Utilisation : voir README.md — `./demo.sh`.
# =====================================================================================================================
name: mosolo-demo

services:
  app:
    image: mosolo:demo
    command: ["demo"]
    env_file: .env
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    expose: ["8080"]
    networks: [interne]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MOSOLO_DOMAIN: ${MOSOLO_DOMAIN:?MOSOLO_DOMAIN absent de .env (./demo.sh le remplit)}
      MOSOLO_ACME_EMAIL: ${MOSOLO_ACME_EMAIL:?MOSOLO_ACME_EMAIL absent de .env}
    volumes:
      # Même Caddyfile que la production : HTTPS automatique pour MOSOLO_DOMAIN, mandataire vers app:8080.
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [interne]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  interne: {}

volumes:
  caddy_data: {}
  caddy_config: {}
